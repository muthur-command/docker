# After a docker GitHub Release, open PRs in repos that pin BASE_IMAGE_VERSION.
# Requires org/repo secret DOCKER_DOWNSTREAM_BUMP_TOKEN (PAT or GitHub App token)
# with contents:write on mc_bd.
#
# Renovate (mc_bd/.github/renovate.json) is a backup on a 12h schedule.

name: Bump downstream docker pins

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. 2026.06.0)
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - mc_bd
    steps:
      - name: Check downstream bump token
        id: token
        env:
          DOCKER_DOWNSTREAM_BUMP_TOKEN: ${{ secrets.DOCKER_DOWNSTREAM_BUMP_TOKEN }}
        run: |
          if [[ -z "${DOCKER_DOWNSTREAM_BUMP_TOKEN}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKER_DOWNSTREAM_BUMP_TOKEN is not set. Skipping downstream PRs for ${{ matrix.repo }}."
            echo "Configure a PAT with contents:write on mc_bd."
            echo "Renovate in mc_bd will still open PRs on its schedule if the Renovate app is enabled."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize release version
        if: steps.token.outputs.skip != 'true'
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pin=${tag#mc_}" >> "$GITHUB_OUTPUT"

      - name: Checkout docker (scripts)
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout ${{ matrix.repo }}
        if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: muthur-command/${{ matrix.repo }}
          ref: mc_bd
          token: ${{ secrets.DOCKER_DOWNSTREAM_BUMP_TOKEN }}
          path: consumer
          persist-credentials: false

      - name: Apply docker pin bump
        if: steps.token.outputs.skip != 'true'
        run: |
          chmod +x ./scripts/bump-downstream-docker-pin.sh
          ./scripts/bump-downstream-docker-pin.sh \
            "${{ matrix.repo }}" \
            "${{ github.workspace }}/consumer" \
            "${{ steps.version.outputs.tag }}"

      - name: Create pull request
        if: steps.token.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.DOCKER_DOWNSTREAM_BUMP_TOKEN }}
          path: consumer
          base: mc_bd
          branch: "bump/docker-${{ steps.version.outputs.pin }}"
          delete-branch: true
          labels: dependencies
          title: "chore(deps): bump muthurcommand-base to ${{ steps.version.outputs.pin }}"
          commit-message: "chore(deps): bump muthurcommand-base to ${{ steps.version.outputs.pin }}"
          body: |
            Automated PR from [docker](https://github.com/muthur-command/docker) release `${{ steps.version.outputs.tag }}`.

            Updates `BASE_IMAGE_VERSION` in `.github/workflows/builder.yml`.

            **You still need to (manual):**
            - Review and merge this PR
            - Release **mc_bd** so GHCR `{arch}-muthurcommand` updates
            - Update **version** JSON `mc_bd` field for channel rollout

            Also tracked by Renovate (`custom.regex` on `muthur-command/docker` releases).
